[workspace]
members = ["crates/cam-core", "crates/cam-app"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
clipper2-rust = { version = "=1.1.0", default-features = false }
boostvoronoi = { version = "=0.12.1", default-features = false }
robust = "=1.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
roxmltree = "=0.21.1"
svgtypes = "=0.16.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
