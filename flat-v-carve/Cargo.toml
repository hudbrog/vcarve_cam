[workspace]
members = ["crates/cam-core", "crates/cam-sketch-solver", "crates/cam-gui", "crates/cam-service", "crates/cam-app", "crates/cam-server"]
resolver = "3"

[workspace.package]
version = "0.7.7"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
clipper2-rust = { version = "=1.1.0", default-features = false }
boostvoronoi = { version = "=0.12.1", default-features = false }
robust = "=1.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
roxmltree = "=0.21.1"
svgtypes = "=0.16.1"
sha2 = "=0.10.9"
arael = { git = "https://github.com/harakas/arael", rev = "18d86e1fda91814a4a42d00001f3e8461c638bb4" }
arael-sketch-solver = { git = "https://github.com/harakas/arael", rev = "18d86e1fda91814a4a42d00001f3e8461c638bb4" }

[profile.dev.package.arael-macros]
opt-level = 3
[profile.dev.package.arael-sym]
opt-level = 3
[profile.release.package.arael-macros]
opt-level = 3
[profile.release.package.arael-sym]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
