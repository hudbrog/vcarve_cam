[package]
name = "cam-gui1"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Deliberately isolated: GUI1 must not select production architecture implicitly.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cam-gui1-desktop"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
egui = "=0.33.3"
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl", "webgpu"] }
cam-core = { path = "../../crates/cam-core" }
cam-service = { path = "../../crates/cam-service" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
bytemuck = { version = "=1.25.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "=0.16.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent"] }

[dev-dependencies]
egui_kittest = { version = "=0.33.3", features = ["eframe", "wgpu", "snapshot"] }

[profile.release]
opt-level = 2
