[package]
name = "sketcher-feasibility"
version = "0.1.0"
edition = "2024"
publish = false

# Qualification only: no production dependency or document schema changes.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sketch-probe"
path = "src/main.rs"

[dependencies]
arael = { path = "../../artifacts/sketcher-feasibility/upstream/arael-18d86e1fda91814a4a42d00001f3e8461c638bb4" }
arael-sketch-solver = { path = "../../artifacts/sketcher-feasibility/upstream/arael-18d86e1fda91814a4a42d00001f3e8461c638bb4/arael-sketch-solver" }
cam-core = { path = "../../crates/cam-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = 3

[profile.release.package.arael-macros]
opt-level = 3

[profile.release.package.arael-sym]
opt-level = 3
