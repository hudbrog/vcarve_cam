[package]
name = "cam-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cam-web"
path = "src/main.rs"

[dependencies]
# Static hosting only: the workspace plans in the browser's own WebAssembly
# worker or in the native GUI, so this crate has no engine dependency.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "signal", "fs"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true
