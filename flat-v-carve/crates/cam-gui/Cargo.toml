[package]
name = "cam-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Deterministic native captures, absent from ordinary application builds.
ui-review = ["dep:image"]

[lib]
name = "cam_gui_runtime"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cam-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }
egui = "=0.33.3"
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl", "webgpu"] }
cam-core = { path = "../cam-core" }
cam-service = { path = "../cam-service" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
bytemuck = { version = "=1.25.0", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "=0.16.0"
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Performance", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent"] }

[dev-dependencies]
# Shader validation without a GPU. wgpu compiles the viewport's WGSL when the
# renderer builds, so a syntax or type error would reach the tester as a failed
# viewport instead of a failing test. naga is already wgpu's shader compiler, so
# this adds no package to the build; it only exposes the same front end and
# validator to `tests/shaders.rs`.
naga = { version = "=27.0.3", features = ["wgsl-in"] }
