<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Field-test fixture A: the report's Inkscape 1.4 circle, written the way
     Inkscape saves a stroked circle with no fill. Fill-mode import must still
     refuse it, because a stroke is not a carveable region, but the refusal
     names this element and says how to convert it. -->
<svg
   width="210mm"
   height="297mm"
   viewBox="0 0 210 297"
   version="1.1"
   id="svg1"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs id="defs1" />
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:document-units="mm"
     showgrid="false" />
  <g
     inkscape:label="Layer 1"
     inkscape:groupmode="layer"
     id="layer1">
    <circle
       style="fill:none;stroke:#000000;stroke-width:1;stroke-dasharray:none"
       id="circle1"
       inkscape:label="Test circle"
       cx="105"
       cy="148.5"
       r="20" />
  </g>
</svg>
