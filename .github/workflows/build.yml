name: Build and test

# The React workspace UI (flat-v-carve/web) is deprecated: it is no longer built
# or exercised here. The GUI is the Rust cam-gui crate (native window plus a
# browser build), and the portable artifact is the command-line cam.exe.
#
# Every Cargo command below selects --workspace, so Cargo resolves one feature
# set for shared dependencies across all steps. Mixing `-p <package>` with
# `--workspace` invocations makes Cargo rebuild cam-gui and cam-app on every run
# (fingerprint dirty: UnitDependencyInfoChanged).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 portable app
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: flat-v-carve
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Add WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          $url = 'https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-pc-windows-msvc.tar.gz'
          curl.exe -sL $url -o wasm-pack.tar.gz
          tar xzf wasm-pack.tar.gz
          Copy-Item wasm-pack-v0.15.0-x86_64-pc-windows-msvc/wasm-pack.exe "$env:USERPROFILE/.cargo/bin/"
          wasm-pack --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: flat-v-carve -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Build new native GUI
        run: ./scripts/build-gui.ps1

      - name: Build new browser GUI
        run: ./scripts/build-gui.ps1 -Target web

      - name: Upload new GUI review builds
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flat-v-carve-gui-windows-and-browser
          path: flat-v-carve/artifacts/gui/
          if-no-files-found: error
          retention-days: 30

      - name: Build portable executable
        run: ./scripts/build-portable.ps1

      - name: Check Rust with Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: ./scripts/run-tests-parallel.ps1

      - name: Write executable checksum
        run: |
          $camHash = (Get-FileHash artifacts/portable/cam.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$camHash *cam.exe" | Set-Content artifacts/portable/SHA256SUMS -Encoding utf8NoBOM
          @"
          Built from commit $env:GITHUB_SHA on Windows x64.
          Download the flat-v-carve-windows-x64 artifact and extract cam.exe.
          Run ``cam.exe --help`` for the CLI commands. The native GUI is built
          separately by ``scripts/build-gui.ps1``.
          SHA-256: ``$camHash``
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload portable Windows application
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flat-v-carve-windows-x64
          path: |
            flat-v-carve/artifacts/portable/cam.exe
            flat-v-carve/artifacts/portable/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
